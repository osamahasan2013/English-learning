<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>You're offline · Word Garden</title>
    <!--
      Served by the service worker (src/sw.ts) when a page that was never opened on this
      device is requested without a connection. Deliberately plain, self-contained HTML with
      no app JavaScript: a Next.js page served at another URL fails to hydrate.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fffaf2;
        color: #1f2937;
        text-align: center;
        font-family:
          ui-rounded,
          "SF Pro Rounded",
          "Nunito",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem 1rem;
      }
      .icon {
        font-size: 4.5rem;
        margin: 0;
      }
      h1 {
        font-size: 1.9rem;
        margin: 0.75rem 0;
      }
      p {
        font-size: 1.1rem;
        color: #5b6474;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.8rem 1.5rem;
        border-radius: 1rem;
        background: #1d4ed8;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 4px solid #f59e0b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="icon" aria-hidden="true">☁️</p>
      <h1>You're offline</h1>
      <p>
        This page hasn't been opened on this device yet, so it needs a connection. Screens and lessons you
        opened before still work, and answers are saved on this device until you're back online.
      </p>
      <a href="/child/home">Go to the child home screen</a>
    </main>
  </body>
</html>
